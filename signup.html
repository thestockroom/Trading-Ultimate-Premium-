<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up | THE STOCK ROOM</title><link rel="stylesheet" href="style.css"></head><body class="page-auth"><div class="watermark">THE STOCK ROOM</div><section class="hero"><div><div class="eyebrow">MEMBER ENTRY</div><h1>SIGN UP</h1><p>Create a local demo profile for educational and virtual-demo access.</p><form class="form" id="signupForm"><input id="signupName" placeholder="Name" required><input id="signupEmail" type="email" placeholder="Email" required><input id="signupPassword" type="password" placeholder="Password" minlength="4" required><button class="btn" type="submit">CREATE & ENTER</button><a class="btn" href="login.html">BACK TO LOGIN</a></form></div></section><footer>© <span class="year"></span> THE STOCK ROOM · Educational & demo platform</footer><script src="script.js"></script><script>document.getElementById('signupForm').addEventListener('submit',function(e){e.preventDefault();localStorage.setItem('tsr_logged_in','1');localStorage.setItem('tsr_member_name',document.getElementById('signupName').value.trim());localStorage.setItem('tsr_member_email',document.getElementById('signupEmail').value.trim());location.href='index.html';});</script></body></html>
